# Builds Tower Controller for Mac (Apple Silicon): the game in its own window (desktop/), as a .dmg and a .zip, and puts them
# on the "desktop-latest" release of this repository. Run it by hand (Actions -> this workflow -> Run workflow).
# The app is NOT signed with an Apple Developer ID (that costs $99 a year): CI signs it ad hoc, which is what Apple Silicon needs to
# run it at all, and macOS asks the player to allow it once (see desktop/README.md).
name: Tower Controller for Mac (Apple Silicon)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (desktop shell and game)
        run: |
          (cd desktop && npm test)
          (cd tower-game && npm test)
      - name: Build the airports (as for the web site)
        working-directory: tower-game
        run: |
          python tools/build_airports.py
          node tools/build_hq.mjs
          printf "export const VERSION = '%s (Mac app)';\n" "$(git rev-parse --short HEAD) $(date -u +'%Y-%m-%d %H:%M')" > js/version.js
      - name: Put the game inside the app
        run: node tower-game/tools/build_site.mjs desktop/app
      - name: Install Electron and the packager
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Pack the app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Sign ad hoc, make the .dmg and the .zip
        working-directory: desktop/dist
        run: |
          APP="$(ls -d mac-arm64/*.app | head -1)"
          echo "App: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Tower Controller"
          rm -rf stage && mkdir stage && cp -R "$APP" stage/ && ln -s /Applications stage/Applications
          hdiutil create -volname "Tower Controller" -srcfolder stage -ov -format UDZO Tower-Controller-arm64.dmg
          ditto -c -k --keepParent "$APP" Tower-Controller-arm64.zip
          ls -la Tower-Controller-arm64.*
      - uses: actions/upload-artifact@v4
        with:
          name: Tower-Controller-Mac-arm64
          path: |
            desktop/dist/Tower-Controller-arm64.dmg
            desktop/dist/Tower-Controller-arm64.zip
      - name: Publish on the releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete desktop-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create desktop-latest --prerelease --target "${{ github.sha }}" \
            --title "Tower Controller for Mac (Apple Silicon)" \
            --notes "Built from commit ${GITHUB_SHA::7}. Not signed with an Apple Developer ID: on first launch see desktop/README.md (System Settings > Privacy & Security > Open Anyway, or run: xattr -dr com.apple.quarantine \"/Applications/Tower Controller.app\")." \
            desktop/dist/Tower-Controller-arm64.dmg desktop/dist/Tower-Controller-arm64.zip
