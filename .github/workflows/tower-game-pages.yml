# Builds the Tower Controller game (tower-game/) with fresh OurAirports data
# and publishes it on GitHub Pages. One-time setup: repository Settings ->
# Pages -> Build and deployment -> Source: "GitHub Actions".
name: Tower game on GitHub Pages

on:
  push:
    paths:
      - "tower-game/**"
      - ".github/workflows/tower-game-pages.yml"
  schedule:
    - cron: "17 3 * * 1" # weekly, to pick up OurAirports updates
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tower-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          npm test
          python -m unittest discover -s tests
      - name: Build airport data from OurAirports
        run: python tools/build_airports.py
      - name: Build the detailed airports from the OpenStreetMap extracts
        run: node tools/build_hq.mjs
      - name: Leave tests and tools out of the site
        run: |
          mkdir -p ../_site
          cp -r index.html tower.css manifest.webmanifest sw.js icons js data ../_site/
          rm -f ../_site/data/osm/*.json  # raw extracts: not needed by the site (data/hq/ is built from them)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # only the default branch publishes; other branches just build and test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
