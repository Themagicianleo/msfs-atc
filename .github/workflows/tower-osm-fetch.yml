# Downloads the OpenStreetMap layout of the game's detailed airports and
# commits it to the branch the workflow runs on (data/osm/). Run by hand when
# the airports should be refreshed.
name: Tower game - fetch OpenStreetMap airport data

on:
  workflow_dispatch:
  push:
    paths:
      - "tower-game/tools/fetch_osm.py"
      - ".github/workflows/tower-osm-fetch.yml"

permissions:
  contents: write

concurrency:
  group: osm-fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from the Overpass API
        working-directory: tower-game
        # one airport at a time, so a slow one doesn't lose the others
        run: |
          for a in WSSS ZBAD KSFO; do python -u tools/fetch_osm.py $a || echo "::warning::$a failed"; done
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tower-game/data/osm
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update OpenStreetMap airport data (WSSS, ZBAD, KSFO)"
          # the branch may have moved while downloading: put the data commit on top
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
